<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Televendas - Julho/2026</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#111;color:#eee;padding:0}
header{background:#1a1a2e;border-bottom:2px solid #f59e0b;padding:16px 24px;display:flex;align-items:center;flex-wrap:wrap;gap:10px}
header h1{font-size:32px;font-weight:700;color:#f59e0b}
header .ref{font-size:18px;color:#888;margin-left:auto}
header .ref span{color:#6b7280;font-size:18px}
.tabs{display:flex;gap:0;background:#0d0d1a;border-bottom:1px solid #333;padding:0 24px}
.tab{padding:14px 28px;font-size:18px;font-weight:600;color:#888;cursor:pointer;border-bottom:2px solid transparent;transition:all .15s;background:none;font-family:inherit}
.tab:hover{color:#eee}
.tab.active{color:#f59e0b;border-bottom-color:#f59e0b;background:rgba(245,158,11,0.05)}
body.polpanorte{background:#1a0a2e}
body.polpanorte header{background:linear-gradient(135deg,#1a0a2e,#2d1052);border-bottom-color:#a855f7}
body.polpanorte header h1{color:#d8b4fe}
body.polpanorte .tabs{background:#120822;border-bottom-color:#3b1a6e}
body.polpanorte .tab.active{color:#d8b4fe;border-bottom-color:#a855f7;background:rgba(168,85,247,0.1)}
body.polpanorte .card{background:linear-gradient(135deg,#1a0a2e 0%,#2d1052 100%);border-color:rgba(168,85,247,0.15)}
body.polpanorte .gauge-card{background:linear-gradient(135deg,#1a0a2e 0%,#2d1052 100%);border-color:rgba(168,85,247,0.15)}
body.polpanorte .chart-box{background:linear-gradient(135deg,#1a0a2e,#2d1052);border-color:rgba(168,85,247,0.15)}
body.polpanorte .card.c-amber::before{background:linear-gradient(90deg,#a855f7,#c084fc)}
body.polpanorte table th{border-bottom-color:rgba(168,85,247,0.3)!important}
body.polpanorte table tr{border-bottom-color:rgba(168,85,247,0.08)}
.container{max-width:1400px;margin:0 auto;padding:24px 40px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-bottom:28px}
.card{background:linear-gradient(135deg,#1a1a2e 0%,#16213e 100%);border:1px solid rgba(255,255,255,0.06);border-radius:14px;padding:22px 24px 18px;position:relative;overflow:hidden;transition:transform .15s,box-shadow .15s}
.card:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,0.3)}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;border-radius:14px 14px 0 0}
.card.c-green::before{background:linear-gradient(90deg,#34d399,#06b6d4)}
.card.c-purple::before{background:linear-gradient(90deg,#a78bfa,#818cf8)}
.card.c-amber::before{background:linear-gradient(90deg,#f59e0b,#fbbf24)}
.card.c-red::before{background:linear-gradient(90deg,#f87171,#fb923c)}
.card .lbl{font-size:18px;color:#9ca3af;text-transform:uppercase;letter-spacing:1.2px;font-weight:600;margin-bottom:6px}
.card .val{font-size:28px;font-weight:800;line-height:1.1}
.card .sub{font-size:26px;font-weight:700;margin-top:4px}
.gauge-wrap{display:flex;gap:14px;margin-bottom:28px}
.gauge-card{flex:1;min-width:280px;background:linear-gradient(135deg,#1a1a2e 0%,#16213e 100%);border:1px solid rgba(255,255,255,0.06);border-radius:14px;padding:20px 24px 16px;text-align:center;position:relative;overflow:hidden;transition:transform .15s,box-shadow .15s}
.gauge-card:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,0.3)}
.gauge-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;border-radius:14px 14px 0 0}
.gauge-card .gauge-title{font-size:18px;color:#9ca3af;text-transform:uppercase;letter-spacing:1.5px;font-weight:700;margin-bottom:4px}
.gauge-card .gauge-svg{display:block;margin:0 auto;width:100%;max-width:460px;height:auto}
.gauge-card .gauge-actual{font-size:36px;font-weight:800;margin-top:-4px}
.gauge-card .gauge-meta{font-size:18px;color:#888;margin-top:4px}
.chart-box{background:linear-gradient(135deg,#1a1a2e 0%,#16213e 100%);border:1px solid rgba(255,255,255,0.06);border-radius:14px;padding:24px;margin-bottom:24px}
.chart-box h2{font-size:20px;font-weight:700;margin-bottom:14px;color:#fcd34d;text-transform:uppercase;letter-spacing:.5px}
.chart-box h2 .sub{font-size:22px;color:#aaa;font-weight:400;text-transform:none;letter-spacing:0}
table{width:100%;border-collapse:collapse;font-size:18px}
th{padding:10px 12px;text-align:left;font-weight:600;color:#999;font-size:18px;text-transform:uppercase;letter-spacing:.5px;background:#111;border-bottom:1px solid #333}
td{padding:9px 12px;text-align:left;border-bottom:1px solid #1a1a2e;color:#ccc}
tr:nth-child(even){background:rgba(255,255,255,0.02)}
tr:hover{background:rgba(255,255,255,0.05)}
.text-right{text-align:right}
.tw{max-height:420px;overflow-y:auto;overflow-x:auto;border:1px solid #333;border-radius:6px}
.tw th{position:sticky;top:0;z-index:2;background:#111}
.bar-bg{height:8px;border-radius:4px;background:#333;overflow:hidden;margin-top:4px;width:140px}
.matriz-wrap{overflow-x:auto}
.matriz-wrap table{font-size:18px!important}
.matriz-wrap table th{padding:6px 6px!important;font-size:16px!important;white-space:nowrap!important}
.matriz-wrap table td{padding:5px 6px!important;font-size:18px!important;white-space:nowrap!important}
.matriz-wrap .bar-bg{width:100px!important}
.bar-fill{height:100%;border-radius:4px}
.cell-cli{max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;color:#fcd34d}
footer{text-align:center;padding:16px;font-size:18px;color:#555;border-top:1px solid #1a1a2e;margin-top:10px}
@media(max-width:600px){.cards{grid-template-columns:1fr}.container{padding:12px}}
</style>
</head>
<body>

<header>
<a href="https://echevarria-bi.github.io/" style="color:#fcd34d;text-decoration:none;font-size:14px;font-weight:700;display:flex;align-items:center;gap:6px;margin-right:16px;white-space:nowrap;padding:8px 18px;border:1.5px solid rgba(245,158,11,0.3);border-radius:10px;background:linear-gradient(135deg,rgba(120,53,15,.25),rgba(69,25,3,.2));transition:all .3s;letter-spacing:.3px" onmouseover="this.style.borderColor='#f59e0b';this.style.boxShadow='0 0 20px rgba(245,158,11,0.15)'" onmouseout="this.style.borderColor='rgba(245,158,11,0.3)';this.style.boxShadow='none'">&#8592; Menu</a>
<h1>&#9742; Televendas &middot; Julho/2026</h1>
<div class="ref">Base 8026 &bull; 6 vendedores</div>
</header>

<div class="tabs">
<button class="tab active" onclick="switchView('geral')">Painel Televendas Julho</button>
<button class="tab" onclick="switchView('polpanorte')">Polpanorte Julho</button>
<button class="tab" onclick="switchView('regiaomes')">An&#225;lise Por Regi&#227;o</button>
</div>

<div class="container" id="app">
<div style="text-align:center;padding:60px 20px;color:#666">Carregando...</div>
</div>

<footer>Dashboard Televendas &bull; Base 8026_2026</footer>

<script>
var DADOS = [];
var activeView = 'geral';

function serialToDate(s){
  if(!s||s<60)return'';
  return new Date((s-1)*86400000-2209161600000).toLocaleDateString('pt-BR');
}

function fmt(v){
  if(v==null||isNaN(v))return'-';
  return'R$ '+v.toLocaleString('pt-BR',{minimumFractionDigits:0,maximumFractionDigits:0});
}

function pct(v,t){
  if(!t||!t)return 0;
  return v/t*100;
}

var METAS = {
  '1596':{nome:'Ariane',regiao:'POA',fat:145000,pos:95},
  '1464':{nome:'Camila',regiao:'SUL',fat:127328,pos:116},
  '1211':{nome:'Cristielen',regiao:'VALE DOS SINOS',fat:117386,pos:116},
  '1429':{nome:'Natália',regiao:'KEY ACCOUNT',fat:350000,pos:10},
  '9886':{nome:'Tatiana',regiao:'SERRA',fat:145000,pos:100},
  '1624':{nome:'Tatiana',regiao:'LITORAL',fat:95000,pos:90}
};

var METAS_POLPA = {
  '1596':{nome:'Ariane',regiao:'POA',fat:36500,pos:62},
  '1464':{nome:'Camila',regiao:'SUL',fat:40000,pos:98},
  '1211':{nome:'Cristielen',regiao:'VALE DOS SINOS',fat:75000,pos:103},
  '1429':{nome:'Natália',regiao:'KEY ACCOUNT',fat:175000,pos:0},
  '9886':{nome:'Tatiana',regiao:'SERRA',fat:87500,pos:143},
  '1624':{nome:'Tatiana',regiao:'LITORAL',fat:0,pos:0}
};

var DADOS_2025 = {
  fat: [1328301.64, 918484.44, 823230.42, 689873.21, 711582.82, 632591.74, 831557.85],
  pos: [481, 456, 394, 372, 320, 327, 391]
};
var META_2026 = {fat: 6642590.92, pos: 3118};

function gaugeSVG(pct, color){
  var cx=100,cy=95,r=72;
  var arcPct=Math.min(Math.max(pct,0),100);
  var angle=180-arcPct*1.8;
  var rad=angle*Math.PI/180;
  var ex=cx+r*Math.cos(rad),ey=cy-r*Math.sin(rad);

  var arcPath='M '+(cx-r)+' '+cy+' A '+r+' '+r+' 0 0 1 '+ex+' '+ey;
  var bgPath='M '+(cx-r)+' '+cy+' A '+r+' '+r+' 0 1 1 '+(cx+r)+' '+cy;

  var nPct=Math.min(Math.max(pct,0),150);
  var nRad=(180-nPct*1.8)*Math.PI/180;
  var needleLen=58;
  var nx=cx+needleLen*Math.cos(nRad);
  var ny=cy-needleLen*Math.sin(nRad);

  var zones='';
  [[180,36,'#ef4444'],[36,0,'#fbbf24']].forEach(function(z){
    var a1=z[0]*Math.PI/180,a2=z[1]*Math.PI/180;
    var ir=60,or=72;
    var x1=cx+or*Math.cos(a1),y1=cy-or*Math.sin(a1);
    var x2=cx+or*Math.cos(a2),y2=cy-or*Math.sin(a2);
    var x3=cx+ir*Math.cos(a2),y3=cy-ir*Math.sin(a2);
    var x4=cx+ir*Math.cos(a1),y4=cy-ir*Math.sin(a1);
    var la=z[0]-z[1]>180?1:0;
    zones+='<path d="M'+x1+' '+y1+' A'+or+' '+or+' 0 '+la+' 1 '+x2+' '+y2+' L'+x3+' '+y3+' A'+ir+' '+ir+' 0 '+la+' 0 '+x4+' '+y4+' Z" fill="'+z[2]+'" opacity="0.25"/>';
  });

  var svg='<svg viewBox="0 0 200 125" class="gauge-svg">'+zones+
    '<path d="'+bgPath+'" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="14" stroke-linecap="round"/>'+
    '<path d="'+arcPath+'" fill="none" stroke="'+color+'" stroke-width="14" stroke-linecap="round" filter="url(#glow)"/>'+
    '<defs><filter id="glow"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>'+
    '<circle cx="'+cx+'" cy="'+cy+'" r="6" fill="'+color+'"/>'+
    '<circle cx="'+cx+'" cy="'+cy+'" r="3" fill="#111"/>'+
    '<line x1="'+cx+'" y1="'+cy+'" x2="'+nx+'" y2="'+ny+'" stroke="'+color+'" stroke-width="2.5" stroke-linecap="round"/>'+
    '<text x="'+cx+'" y="'+cy+24+'" text-anchor="middle" fill="'+color+'" font-size="20" font-weight="800">'+pct.toFixed(1)+'%</text>'+
    '</svg>';
  return svg;
}

function switchView(view){
  activeView = view;
  document.body.className = view === 'polpanorte' ? 'polpanorte' : '';
  var tabs = document.querySelectorAll('.tab');
  for(var ti=0;ti<tabs.length;ti++){
    tabs[ti].className = 'tab' + ((tabs[ti].getAttribute('onclick').indexOf("'"+view+"'") >= 0) ? ' active' : '');
  }
  if (activeView === 'regiaomes') renderRegiaoMes();
  else render();
}

function render(){
  if(!DADOS||!DADOS.length){
    document.getElementById('app').innerHTML='<div style="padding:40px;text-align:center;color:#666">Sem dados.</div>';
    return;
  }

  var filterCod = activeView === 'polpanorte' ? '10828' : null;
  var filtered = filterCod ? DADOS.filter(function(r){return String(r.codfornec)===filterCod;}) : DADOS;
  var metas = filterCod ? METAS_POLPA : METAS;
  var viewName = activeView === 'polpanorte' ? 'Polpanorte' : 'Geral';

  var pos=filtered.filter(function(r){return r.fat>=1;});

  var fatBru=filtered.reduce(function(s,r){return s+r.fat;},0);
  var totPos=pos.length;

  var cliPos={};
  pos.forEach(function(r){cliPos[r.codcli]=(cliPos[r.codcli]||0)+r.fat;});
  var qtdCliPos=Object.keys(cliPos).length;
  var tick=totPos>0?fatBru/totPos:0;

  var diasCorridos=Math.min(21,31);
  var diasUteis=23;
  var projMult=diasUteis/diasCorridos;

  var metaFatTotal=0,metaPosTotal=0;
  Object.keys(metas).forEach(function(k){metaFatTotal+=metas[k].fat||0;metaPosTotal+=metas[k].pos||0;});

  var fatProj=Math.round(fatBru*projMult);
  var posProj=Math.round(qtdCliPos*projMult);
  var pfProjPct=metaFatTotal>0?fatProj/metaFatTotal*100:0;
  var ppProjPct=metaPosTotal>0?posProj/metaPosTotal*100:0;

  var pfPct=metaFatTotal>0?fatBru/metaFatTotal*100:0;
  var ppPct=metaPosTotal>0?qtdCliPos/metaPosTotal*100:0;
  var pfC=pfPct>=100?'#34d399':pfPct>=80?'#fbbf24':'#f87171';
  var ppC=ppPct>=100?'#34d399':ppPct>=80?'#fbbf24':'#f87171';

  var c='<div class="gauge-wrap">'+
    '<div class="gauge-card"><div class="gauge-title">Faturamento vs Meta</div>'+
    gaugeSVG(pfPct,pfC)+
    '<div class="gauge-actual" style="color:'+pfC+'">'+fmt(fatBru)+'</div>'+
    '<div style="font-size:18px;color:#f59e0b;margin-top:2px">Proj. 31/07: '+fmt(fatProj)+' ('+pfProjPct.toFixed(1)+'%)</div>'+
    '<div class="gauge-meta">Meta: '+fmt(metaFatTotal)+'</div></div>'+
    '<div class="gauge-card"><div class="gauge-title">Positiva\u00e7\u00e3o vs Meta</div>'+
    gaugeSVG(ppPct,ppC)+
    '<div class="gauge-actual" style="color:'+ppC+'">'+qtdCliPos+'</div>'+
    '<div class="gauge-meta">Meta: '+metaPosTotal+'</div></div></div>'+
    '<div style="display:flex;gap:24px;justify-content:center;margin-top:-20px;margin-bottom:20px;font-size:18px;color:#888">'+
    '<span><span style="display:inline-block;width:12px;height:12px;border-radius:3px;background:#ef4444;margin-right:4px;vertical-align:middle"></span> Abaixo 80%</span>'+
    '<span><span style="display:inline-block;width:12px;height:12px;border-radius:3px;background:#fbbf24;margin-right:4px;vertical-align:middle"></span> 80% a 99%</span>'+
    '<span><span style="display:inline-block;width:12px;height:12px;border-radius:3px;background:#34d399;margin-right:4px;vertical-align:middle"></span> Meta batida (100%+)</span></div>';

  var vends={};
  // Faturamento + clientes fat = todos registros (inclui devoluções)
  filtered.forEach(function(r){
    if(!vends[r.codusur])vends[r.codusur]={codusur:r.codusur,rca:r.rca,regiao:(metas[r.codusur]||{}).regiao||'',pedidos:0,fat:0,clientes:{}};
    vends[r.codusur].fat+=r.fat;
    if(!vends[r.codusur].clientes[r.codcli])vends[r.codusur].clientes[r.codcli]={fat:0,pos:0};
    vends[r.codusur].clientes[r.codcli].fat+=r.fat;
  });
  // Positivação = só registros positivos
  pos.forEach(function(r){
    vends[r.codusur].pedidos++;
    vends[r.codusur].clientes[r.codcli].pos++;
  });

  var vArr=Object.keys(vends).map(function(k){return vends[k];}).sort(function(a,b){return a.rca.localeCompare(b.rca);});

  if(activeView==='polpanorte'){
    var tatA=vends['9886'],tatB=vends['1624'];
    if(tatA&&tatB){
      var mtA=METAS_POLPA['9886']||{},mtB=METAS_POLPA['1624']||{};
      var merged={codusur:'9886',rca:'TATIANA LACERDA BACELLAR',regiao:'SERRA + LITORAL',fat:tatA.fat+tatB.fat,clientes:{}};
      Object.keys(tatA.clientes).forEach(function(k){merged.clientes[k]=tatA.clientes[k];});
      Object.keys(tatB.clientes).forEach(function(k){merged.clientes[k]=tatB.clientes[k];});
      vArr=vArr.filter(function(v){return v.codusur!=='9886'&&v.codusur!=='1624';});
      vArr.push(merged);
      vArr.sort(function(a,b){return a.rca.localeCompare(b.rca);});
      metas=Object.assign({},metas,{'9886':{nome:'Tatiana',regiao:'SERRA + LITORAL',fat:(mtA.fat||0)+(mtB.fat||0),pos:(mtA.pos||0)+(mtB.pos||0)}});
    }
  }

  vArr.forEach(function(v){
    v.nome=v.rca.split(' ')[0];
    if(v.codusur==='1624') v.nome+=' - Litoral';
  });

  var m='<div class="chart-box"><h2>Matriz de Positiva\u00e7\u00e3o <span class="sub">'+viewName+' &mdash; Julho/2026 vs Meta</span></h2><div class="matriz-wrap"><table style="font-size:14px"><thead><tr><th style="font-size:13px">Vendedor</th><th style="font-size:13px">Regi\u00e3o</th><th class="text-right" style="font-size:13px">Meta FAT</th><th class="text-right" style="font-size:13px">FAT</th><th style="font-size:13px">% FAT</th><th class="text-right" style="font-size:13px;color:#f59e0b">Proj. FAT</th><th class="text-right" style="font-size:13px;color:#60a5fa">A Faturar</th><th class="text-right" style="font-size:13px">Meta Pos.</th><th class="text-right" style="font-size:13px">Pos.</th><th style="font-size:13px">% Pos.</th><th class="text-right" style="font-size:13px">Ticket M\u00e9dio</th></tr></thead><tbody>';
  var totFat=0,tMetaFat=0,totPos=0,tMetaPos=0;
  vArr.forEach(function(v,i){
    var qc=Object.keys(v.clientes).length;
    var mt=metas[v.codusur]||{};
    var pf=mt.fat>0?pct(v.fat,mt.fat):0;
    var pp=mt.pos>0?pct(qc,mt.pos):0;
    var fC=pf>=100?'#34d399':pf>=80?'#fbbf24':'#f87171';
    var pC=pp>=100?'#34d399':pp>=80?'#fbbf24':'#f87171';
    var vProj=Math.round(v.fat*projMult);
    var vProjPct=mt.fat>0?vProj/mt.fat*100:0;
    var vProjPos=Math.round(qc*projMult);
    var vProjPosPct=mt.pos>0?vProjPos/mt.pos*100:0;
    totFat+=v.fat;tMetaFat+=mt.fat||0;totPos+=qc;tMetaPos+=mt.pos||0;
    var faltaFat=(mt.fat||0)>v.fat?mt.fat-v.fat:((mt.fat||0)>0?0:null);
    var faltaPos=(mt.pos||0)>qc?mt.pos-qc:((mt.pos||0)>0?0:null);
    var afat=0;
    if(typeof AFATURAR!=='undefined'){
      afat=AFATURAR[v.codusur]||0;
      if(activeView==='polpanorte'&&v.codusur==='9886') afat=(AFATURAR['9886']||0)+(AFATURAR['1624']||0);
    }
    m+='<tr'+(i%2===0?' style="background:rgba(255,255,255,0.02)"':'')+'>'+
      '<td style="font-weight:600;color:#fcd34d;font-size:13px">'+v.nome+'</td>'+
      '<td style="color:#888;font-size:13px">'+v.regiao+'</td>'+
      '<td class="text-right" style="color:#888;white-space:nowrap;font-size:13px">'+fmt(mt.fat||0)+'</td>'+
      '<td class="text-right" style="color:#fbbf24;font-weight:700;white-space:nowrap;font-size:13px">'+fmt(v.fat)+'</td>'+
      '<td style="font-size:13px"><div class="bar-bg" style="width:100px"><div class="bar-fill" style="width:'+Math.min(pf,100).toFixed(0)+'%;background:'+fC+'"></div></div><span style="font-size:12px;color:'+fC+';font-weight:600">'+pf.toFixed(1)+'%</span>'+(faltaFat===null?'<div style="font-size:10px;color:#888;margin-top:1px">Sem meta</div>':faltaFat>0?'<div class="lbl-falta" style="color:#f87171;font-size:10px">Falta '+fmt(faltaFat)+'</div>':'<div class="lbl-falta" style="color:#34d399;font-size:10px">OK</div>')+'</td>'+
      '<td class="text-right" style="color:#f59e0b;font-weight:600;white-space:nowrap;font-size:13px">'+fmt(vProj)+' <span style="font-size:10px;color:'+(vProjPct>=100?'#34d399':vProjPct>=80?'#fbbf24':'#f87171')+'">'+vProjPct.toFixed(0)+'%</span></td>'+
      '<td class="text-right" style="color:#60a5fa;font-weight:600;white-space:nowrap;font-size:13px">'+fmt(afat)+'</td>'+
      '<td class="text-right" style="color:#888;font-size:13px">'+(mt.pos||'&mdash;')+'</td>'+
      '<td class="text-right" style="color:#34d399;font-weight:600;font-size:13px">'+qc+'</td>'+

function renderRegiaoMes(){
  if(!DADOS_MES||!REGIAO_MES){
    document.getElementById('app').innerHTML='<div style="padding:40px;text-align:center;color:#666">Dados mensais não carregados.</div>';
    return;
  }

  var months=['Jan','Fev','Mar','Abr','Mai','Jun','Jul'];
  var fullMonths=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho'];
  var order=['Região Metropolitana','Região Sul','Serra','Litoral','Vale dos Sinos'];
  var cores=['#f59e0b','#34d399','#60a5fa','#a78bfa','#f87171'];

  // Projeção Julho: (faturamento atual / dias corridos) * dias úteis
  var diasCorridos=Math.min(21,31); // até 21/07
  var diasUteis=23; // julho 2026 tem 23 dias úteis
  var projMult=diasUteis/diasCorridos; // 23/21 = 1.0952

  function calcReg(reg){
    var rd=REGIAO_MES[reg];
    if(!rd)return null;
    var out={months:[],totalFat:0,totalCli:0};
    for(var m=1;m<=7;m++){
      var fat=0,cli=0;
      (rd[m]||[]).forEach(function(c){
        var ov=CLIENT_REGIAO[m]&&CLIENT_REGIAO[m][c];
        if(ov){
          var cliSet={},sum=0;
          for(var di=0;di<DADOS.length;di++){
            var row=DADOS[di];
            if(String(row.codusur)===c&&ov[row.codcli]===reg&&row.fat>=1){
              sum+=row.fat;cliSet[row.codcli]=1;
            }
          }
          fat+=sum;cli+=Object.keys(cliSet).length;
        }else{
          var d=DADOS_MES[m][c];
          if(d){fat+=d.fat;cli+=d.cli;}
        }
      });
      out.months.push({fat:fat,cli:cli});
      out.totalFat+=fat;out.totalCli+=cli;
    }
    return out;
  }

  var regData={};
  order.forEach(function(reg,ri){regData[reg]=calcReg(reg);regData[reg].cor=cores[ri];});
  var oldJul={}; // July 2025 FAT per region (from Análise Televendas.xlsx - Página1)
  oldJul['Região Metropolitana']=268277.70; oldJul['Região Sul']=164407.52;
  oldJul['Serra']=121574.21; oldJul['Litoral']=69798.86;
  oldJul['Vale dos Sinos']=207499.57;

  var gFat=0,gPed=0;
  order.forEach(function(reg){gFat+=regData[reg].totalFat;gPed+=regData[reg].totalCli;});
  var gTick=gPed>0?gFat/gPed:0;

  var mFat=[0,0,0,0,0,0,0];
  var mPos=[0,0,0,0,0,0,0];
  var mPed=[0,0,0,0,0,0,0];
  order.forEach(function(reg){
    for(var i=0;i<7;i++){
      mFat[i]+=regData[reg].months[i].fat;
      mPos[i]+=regData[reg].months[i].cli;
      mPed[i]+=regData[reg].months[i].cli;
    }
  });

  var maxFV=Math.max.apply(null,mFat);if(maxFV===0)maxFV=1;
  var maxPV=Math.max.apply(null,mPos);if(maxPV===0)maxPV=1;

  // Salvar valores reais de Julho
  var fatJulReal=mFat[6], posJulReal=mPos[6];
  // Projetar Julho
  mFat[6]=Math.round(mFat[6]*projMult);

  // Valores por região para projeção
  order.forEach(function(reg){regData[reg].fatJulProj=Math.round(regData[reg].months[6].fat*projMult);});

  function svgLine(vals,color,vals25,isProj,realLast){
    var all=vals.slice();if(vals25)all=all.concat(vals25);
    if(isProj&&realLast!=null)all.push(realLast);
    var max=Math.max.apply(null,all);if(max===0)max=1;
    var min=0;
    var range=max-min||1;
    var W=960,H=310,PL=60,PR=40,PT=40,PB=40;
    var cw=W-PL-PR,ch=H-PT-PB;
    function yPos(v){return PT+ch-((v-min)/range)*ch;}
    function xPos(i){return PL+i/(6)*cw;}
    function fVal(v){return color==='#f59e0b'?fmt(v):String(v);}

    var L=[];
    function addL(i,v,ser,ox){
      if(v==null)return;
      var x=xPos(i)+(ox||0), y=yPos(v), t=fVal(v);
      var above=true;
      if(vals25&&ser===0&&vals25[i]!=null)above=vals[i]>=vals25[i];
      if(vals25&&ser===1&&vals[i]!=null)above=vals25[i]>vals[i];
      L.push({x:x, ay:y, t:t, w:t.length*6.5, h:14,
        adjY: above? y-26 : y+26, ser:ser, m:i});
    }
    for(var i=0;i<7;i++)addL(i,vals[i],0);
    if(isProj&&realLast!=null)addL(6,realLast,2,18);
    if(vals25)for(var i=0;i<7;i++)addL(i,vals25[i],1);

    // Resolve collisions: push harder, more iterations
    for(var it=0;it<50;it++){
      var hit=false;
      for(var i=0;i<L.length;i++)for(var j=i+1;j<L.length;j++){
        var a=L[i],b=L[j];
        if(Math.abs(a.x-b.x)>=(a.w+b.w)/2+10)continue;
        if(Math.abs(a.adjY-b.adjY)>=26)continue;
        var push=5;
        if(Math.abs(a.x-b.x)<20)push=7;
        if(a.adjY<=b.adjY){a.adjY-=push;b.adjY+=push;}
        else{b.adjY-=push;a.adjY+=push;}
        hit=true;
      }
      for(var i=0;i<L.length;i++){
        if(L[i].adjY<14)L[i].adjY=14;
        if(L[i].adjY>H-6)L[i].adjY=H-6;
      }
      if(!hit)break;
    }

    var s='<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto"><rect width="'+W+'" height="'+H+'" fill="none"/>';
    // Grid
    for(var g=0;g<=4;g++){
      var gy=PT+(g/4)*ch;
      var gv=Math.round(max-(g/4)*range);
      s+='<line x1="'+PL+'" y1="'+gy+'" x2="'+(W-PR)+'" y2="'+gy+'" stroke="#1e1b4b" stroke-width="1"/>'+
        (!vals25?'<text x="'+(PL-5)+'" y="'+(gy+4)+'" fill="#6b7280" font-size="11" text-anchor="end">'+fVal(gv)+'</text>':'');
    }
    // 2025 line + dots
    if(vals25){
      var p25=[];for(var i=0;i<7;i++)p25.push(xPos(i)+','+yPos(vals25[i]));
      s+='<polyline points="'+p25.join(' ')+'" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="5,3" stroke-linejoin="round" stroke-linecap="round"/>';
      for(var i=0;i<7;i++)s+='<circle cx="'+xPos(i)+'" cy="'+yPos(vals25[i])+'" r="3" fill="#6b7280" stroke="#111" stroke-width="1.5"/>';
    }
    // 2026 line: all solid if no projection, or dashed Jun-Jul if projection
    var pSolid=[];
    for(var i=0;i<6;i++)pSolid.push(xPos(i)+','+yPos(vals[i]));
    if(isProj&&realLast!=null){
      pSolid.push(xPos(6)+','+yPos(realLast));
    }else{
      pSolid.push(xPos(6)+','+yPos(vals[6]));
    }
    s+='<polyline points="'+pSolid.join(' ')+'" fill="none" stroke="'+color+'" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>';
    if(isProj){
      var pProj=[];
      pProj.push(xPos(5)+','+yPos(vals[5]));
      pProj.push(xPos(6)+','+yPos(vals[6]));
      s+='<polyline points="'+pProj.join(' ')+'" fill="none" stroke="'+color+'" stroke-width="2" stroke-dasharray="6,4" stroke-linejoin="round" stroke-linecap="round" opacity="0.5"/>';
      s+='<rect x="'+(xPos(5)+4)+'" y="'+(PT-2)+'" width="'+(xPos(6)-xPos(5)-8)+'" height="'+(ch+4)+'" fill="rgba(245,158,11,0.04)" rx="4"/>';
    }
    s+='<polyline points="'+pSolid.join(' ')+'" fill="none" stroke="'+color+'" stroke-width="6" stroke-linejoin="round" stroke-linecap="round" opacity="0.15"/>';
    for(var i=0;i<7;i++){
      if(i===6&&isProj&&realLast!=null){
        s+='<circle cx="'+xPos(6)+'" cy="'+yPos(vals[6])+'" r="5" fill="none" stroke="'+color+'" stroke-width="2.5"/>';
        s+='<circle cx="'+(xPos(6)+18)+'" cy="'+yPos(realLast)+'" r="5" fill="#22c55e" stroke="#22c55e" stroke-width="2"/>';
      }else{
        s+='<circle cx="'+xPos(i)+'" cy="'+yPos(vals[i])+'" r="4.5" fill="'+color+'" stroke="'+color+'" stroke-width="2"/>';
      }
    }
    // Leader lines for labels pushed >20px
    for(var i=0;i<L.length;i++){
      var d=Math.abs(L[i].adjY-L[i].ay);
      if(d>16){
        var ly=L[i].adjY+(L[i].adjY>L[i].ay?-4:4);
        s+='<line x1="'+L[i].x+'" y1="'+L[i].ay+'" x2="'+L[i].x+'" y2="'+ly+'" stroke="#6b7280" stroke-width="0.8" stroke-dasharray="2,2"/>';
      }
    }
    // Labels
    for(var i=0;i<L.length;i++){
      var l=L[i];
      var lCol=l.ser===1?'#9ca3af':l.ser===2?'#22c55e':'#f3f4f6';
      var lSz=l.ser===0?'13':'12';
      var lW=l.ser===0?'600':'400';
      s+='<text x="'+l.x+'" y="'+l.adjY+'" fill="'+lCol+'" font-size="'+lSz+'" text-anchor="middle" font-weight="'+lW+'">'+l.t+'</text>';
    }
    // Projection annotation - arrow above the projected value label
    if(isProj){
      for(var li=0;li<L.length;li++){
        if(L[li].m===6&&L[li].ser===0){
          var lx=L[li].x, annY=PT-8;
          s+='<polygon points="'+(lx-4)+','+(annY-8)+' '+(lx+4)+','+(annY-8)+' '+lx+','+annY+'" fill="#f59e0b"/>';
          s+='<text x="'+lx+'" y="'+(annY-16)+'" fill="#f59e0b" font-size="11" font-weight="700" text-anchor="middle">Proje\u00e7\u00e3o Julho</text>';
          break;
        }
      }
    }
    // Month labels
    for(var i=0;i<7;i++){
      var ml=i===6?'Jul*':months[i];
      var mc=i===6?'#f59e0b':'#9ca3af';
      s+='<text x="'+xPos(i)+'" y="'+(H-8)+'" fill="'+mc+'" font-size="13" text-anchor="middle" font-weight="'+(i===6?'700':'400')+'">'+ml+'</text>';
    }
    s+='</svg>';
    return s;
  }

  var html='<div class="cards">';
  html+='<div class="card"><div class="lbl">Faturamento Jan-Jul (real)</div><div class="val" style="color:#fbbf24">'+fmt(gFat)+'</div></div>';
  html+='<div class="card" style="border:1px solid #f59e0b;background:rgba(245,158,11,0.08)"><div class="lbl" style="color:#f59e0b;font-weight:700">JULHO 2026 (m\u00eas vigente)</div><div style="display:flex;gap:20px;margin-top:6px"><div><div style="font-size:18px;color:#888;margin-bottom:2px">PROJE\u00c7\u00c3O 31/07</div><div class="val" style="color:#fbbf24">'+fmt(mFat[6])+'</div></div><div style="text-align:center"><div style="font-size:18px;color:#22c55e;font-weight:700">FATURAMENTO REAL</div><div class="val" style="color:#22c55e">'+fmt(fatJulReal)+'</div></div><div style="text-align:center"><div style="font-size:18px;color:#34d399;font-weight:700">POSITIVA\u00c7\u00c3O</div><div class="val" style="color:#34d399">'+mPos[6]+'</div></div></div></div>';
  html+='</div>';

  // Ticker logo abaixo dos big numbers
  html+='<style>@keyframes ticker{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}.ticker-wrap{overflow:hidden;margin-bottom:14px;padding:4px 0;border-top:1px solid rgba(245,158,11,0.1);border-bottom:1px solid rgba(245,158,11,0.1)}.ticker-inner{display:flex;gap:20px;width:fit-content;animation:ticker 70s linear infinite}.ticker-wrap:hover .ticker-inner{animation-play-state:paused}.ticker-card{flex-shrink:0;width:500px;position:relative;background:linear-gradient(135deg,#1a1a2e 0%,#16213e 100%);border:1px solid rgba(255,255,255,0.1);border-radius:10px;padding:9px 16px}.ticker-card .t-bar{position:absolute;top:0;left:0;bottom:0;width:3px}.ticker-card .t-title{font-size:19px;font-weight:700;letter-spacing:.5px;margin-bottom:5px}.ticker-card .t-vals{display:flex;gap:8px;justify-content:space-evenly}.ticker-card .t-v{font-size:18px;font-weight:700;white-space:nowrap;text-align:center}.ticker-card .t-lbl{font-size:18px;color:#888;text-transform:uppercase;letter-spacing:.6px;text-align:center}</style><div class="ticker-wrap"><div class="ticker-inner">';
  function tCard(reg,ri){
    var rd=regData[reg];var j26=rd.months[6].fat;var jP=rd.fatJulProj;var j25=oldJul[reg];
    var d=j25?((jP>=j25)?'▲':'▼'):'';var a=j25?fmt(Math.abs(jP-j25)):'N/A';
    var p=j25?(((jP-j25)/j25*100)>=0?'+':'')+((jP-j25)/j25*100).toFixed(1)+'%':'';
    return '<div class="ticker-card"><div class="t-bar" style="background:'+rd.cor+'"></div>'+
      '<div class="t-title" style="color:'+rd.cor+'">'+reg+'</div>'+
      '<div class="t-vals"><div><div class="t-lbl">FAT</div><div class="t-v" style="color:#fbbf24">'+fmt(j26)+'</div></div>'+
      '<div><div class="t-lbl">PROJ</div><div class="t-v" style="color:#f59e0b">'+fmt(jP)+'</div></div>'+
      (j25?'<div><div class="t-lbl">JUL/25</div><div class="t-v" style="color:#9ca3af">'+fmt(j25)+'</div></div>':'')+
      (j25?'<div><div class="t-lbl">VS 25</div><div class="t-v" style="color:'+(jP>=j25?'#34d399':'#f87171')+'">'+d+' '+p+'</div></div>':'')+
      '</div></div>';
  }
  for(var ti=0;ti<2;ti++){
    order.forEach(function(reg,ri){html+=tCard(reg,ri);});
  }
  html+='</div></div>';
  html+='<div style="text-align:right;font-size:18px;color:#6b7280;margin-top:-8px;margin-bottom:14px">* Key Account (Natália) incluso nos valores de cada região</div>';

  html+='<div class="chart-box" style="margin-bottom:14px">'+
    '<table width="100%" style="margin-bottom:4px"><tr>'+
    '<td style="text-align:left;vertical-align:middle"><span style="font-weight:700;color:#fcd34d;font-size:18px">Evolução Faturamento <span style="font-size:18px;color:#6b7280;font-weight:400">2026 vs 2025</span></span></td>'+
    '<td style="text-align:right;vertical-align:middle"><span style="display:inline-flex;align-items:center;gap:6px;margin-right:12px;font-size:15px;color:#888"><span style="display:inline-block;width:12px;height:12px;border-radius:50%;background:'+(DADOS_2025?'#f59e0b':'#eee')+';vertical-align:middle"></span>2026 <span style="display:inline-block;width:24px;height:2px;background:#6b7280;vertical-align:middle;margin-left:4px;margin-right:4px"></span>2025</span>'+
    '<span style="display:inline-block;background:rgba(34,197,94,0.15);border:1px solid #22c55e;border-radius:8px;padding:6px 18px;font-size:18px;color:#22c55e;font-weight:700">REAL '+fmt(fatJulReal)+'</span>'+
    '</td>'+
    '</tr></table>'+
    '<div style="max-width:100%">'+svgLine(mFat,'#f59e0b',DADOS_2025.fat,true)+'</div></div>';

  html+='<div class="chart-box" style="margin-bottom:14px">'+
    '<table width="100%" style="margin-bottom:4px"><tr>'+
    '<td style="text-align:left;vertical-align:middle"><span style="font-weight:700;color:#fcd34d;font-size:18px">Evolução Positivações <span style="font-size:18px;color:#6b7280;font-weight:400">2026 vs 2025</span></span></td>'+
    '<td style="text-align:right;vertical-align:middle"><span style="display:inline-flex;align-items:center;gap:6px;margin-right:12px;font-size:15px;color:#888"><span style="display:inline-block;width:12px;height:12px;border-radius:50%;background:'+(DADOS_2025?'#34d399':'#eee')+';vertical-align:middle"></span>2026 <span style="display:inline-block;width:24px;height:2px;background:#6b7280;vertical-align:middle;margin-left:4px;margin-right:4px"></span>2025</span>'+
    '<span style="display:inline-block;background:rgba(34,197,94,0.15);border:1px solid #22c55e;border-radius:8px;padding:6px 18px;font-size:18px;color:#22c55e;font-weight:700">REAL '+posJulReal+'</span>'+
    '</td>'+
    '</tr></table>'+
    '<div style="max-width:100%">'+svgLine(mPos,'#34d399',DADOS_2025.pos)+'</div></div>';

  // Matriz Faturamento por Região (sem Key Account nas regiões)
  var regExclude = JSON.parse(JSON.stringify(REGIAO_MES));
  for(var rk in regExclude){
    if(regExclude[rk][7]) regExclude[rk][7] = regExclude[rk][7].filter(function(c){return c!=='1429';});
  }
  function calcRegTable(reg){
    var rd=regExclude[reg]; if(!rd)return null;
    var out={months:[],totalFat:0};
    for(var m=1;m<=7;m++){
      var fat=0;
      (rd[m]||[]).forEach(function(c){
        var ov=CLIENT_REGIAO[m]&&CLIENT_REGIAO[m][c];
        if(ov){
          for(var di=0;di<DADOS.length;di++){
            var row=DADOS[di];
            if(String(row.codusur)===c&&ov[row.codcli]===reg&&row.fat>=1) fat+=row.fat;
          }
        }else{
          var d=DADOS_MES[m]&&DADOS_MES[m][c]; if(d) fat+=d.fat;
        }
      });
      out.months.push({fat:fat}); out.totalFat+=fat;
    }
    return out;
  }
  html+='<div class="chart-box">';
  html+='<h2>Faturamento por Região <span class="sub">Jan–Jul/2026: nesta tabela, Key Account é exibido separadamente para uma leitura exclusiva desse segmento. Nos cards rotativos, ele é considerado dentro da região de cada cliente.</span></h2>';
  html+='<div style="overflow-x:auto"><table><thead><tr><th>Região</th>';
  for(var mi=0;mi<7;mi++) html+='<th class="text-right">'+months[mi]+'</th>';
  html+='<th class="text-right" style="color:#f59e0b">Total</th></tr></thead><tbody>';
  var rColTotals=[0,0,0,0,0,0,0];
  var rGrandTotal=0;
  order.forEach(function(reg,ri){
    var rd=calcRegTable(reg);
    if(!rd)return;
    var total=0;
    html+='<tr><td style="font-weight:600;color:#fcd34d;border-left:3px solid '+cores[ri]+'">'+reg+'</td>';
    for(var mi=0;mi<7;mi++){
      var fat=Math.round(rd.months[mi].fat*100)/100;
      total+=fat;
      rColTotals[mi]+=fat;
      html+='<td class="text-right" style="white-space:nowrap;color:#fbbf24">'+fmt(fat)+'</td>';
    }
    rGrandTotal+=total;
    html+='<td class="text-right" style="font-weight:700;color:#34d399">'+fmt(total)+'</td></tr>';
  });
  // Key Account row (só Julho)
  var kaTotal=0;
  html+='<tr><td style="font-weight:600;color:#f59e0b;border-left:3px solid #f59e0b">Key Account</td>';
  for(var mi=0;mi<7;mi++){
    if(mi===6){
      var kd=DADOS_MES[mi+1]&&DADOS_MES[mi+1]['1429']?DADOS_MES[mi+1]['1429'].fat:0;
      kaTotal+=kd;
      rColTotals[mi]+=kd;
      html+='<td class="text-right" style="white-space:nowrap;color:#f59e0b">'+fmt(kd)+'</td>';
    }else{
      html+='<td class="text-right" style="white-space:nowrap;color:#4a4d6e">&mdash;</td>';
    }
  }
  rGrandTotal+=kaTotal;
  html+='<td class="text-right" style="font-weight:700;color:#f59e0b">'+fmt(kaTotal)+'</td></tr>';
  html+='<tfoot><tr style="border-top:2px solid #f59e0b"><td style="font-weight:700;color:#fcd34d">Total</td>';
  for(var mi=0;mi<7;mi++) html+='<td class="text-right" style="font-weight:700;color:#fbbf24">'+fmt(rColTotals[mi])+'</td>';
  html+='<td class="text-right" style="font-weight:700;color:#34d399">'+fmt(rGrandTotal)+'</td></tr></tfoot>';
  html+='</tbody></table></div></div>';

  document.getElementById('app').innerHTML=html;
}
</script>
<script src="dados_julho.js"></script>
<script src="dados_mensal.js"></script>
<script src="dados_polpa_mensal.js"></script>
<script src="afaturar.js"></script>
<script src="regiao_mes.js"></script>
<script>render();</script>
